general {
    grace = 2
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 2
    blur_size = 5
    color = rgba(1f1d2e80)
}

input-field {
    monitor =
    size = 400, 60
    outline_thickness = 30
    dots_size = 0.33
    dots_spacing = 0.15
    dots_center = true

    outer_color = rgb(33CCFE)
    inner_color = rgb(1f1d2e)
    font_color = rgb(e0def4)

    check_color = rgb(eb6f92)
    fail_color = rgb(31748f)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>

    capslock_color = rgb(eb6f92)
    bothlock_color = rgb(eb6f92)

    fade_on_empty = true
    placeholder_text = <i>Password...</i>

    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%I:%M %p")"
    color = rgb(e0def4)
    font_size = 64
    font_family = JetBrainsMonoNL Nerd Font Mono
    position = 0, 150
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%a, %B %e")"
    color = rgb(e0def4)
    font_size = 20
    font_family = JetBrainsMonoNL Nerd Font Mono
    position = 0, 80
    halign = center
    valign = center
}
